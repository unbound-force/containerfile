# build-base.yml — Multi-arch base image build and push
#
# Builds opencode-base (Fedora 41 + Go + system packages) for linux/arm64
# and linux/amd64 on native runners (no QEMU), through jflowers/ship's
# shared container-image.yml: build, smoke test, then one multi-arch
# manifest.
#
# Triggers:
#   - Weekly schedule (Monday 04:00 UTC)
#   - Manual dispatch
#   - Pull request changing Containerfile.base or this file: build + smoke
#     test only (no push)
#
# GitHub disables a scheduled workflow after 60 days without repository
# activity; re-enable it under Actions if the weekly build stops.
#
# Requirements: FR-024, FR-027

name: Build Base Image

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["Containerfile.base", ".github/workflows/build-base.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: opencode-base
    uses: jflowers/ship/.github/workflows/container-image.yml@7c6c0e199099d732e0db93c8c9d86b0064c2759c # v0.9.0
    with:
      image: quay.io/unbound-force/opencode-base
      containerfile: Containerfile.base
      tags: latest
      push: ${{ github.event_name != 'pull_request' }}
      smoke: |
        echo "==> Base image smoke tests ..."
        podman run --rm --entrypoint go "$IMAGE" version
        podman run --rm --entrypoint node "$IMAGE" --version
        podman run --rm --entrypoint git "$IMAGE" --version
        podman run --rm --entrypoint gh "$IMAGE" --version

        USER_OUTPUT=$(podman run --rm --entrypoint whoami "$IMAGE")
        if [ "$USER_OUTPUT" != "dev" ]; then
          echo "ERROR: Expected 'dev' but got '$USER_OUTPUT'"
          exit 1
        fi
        echo "All base image smoke tests passed"
    permissions:
      contents: read
    secrets:
      REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
